services:
  quality-inference:
    build:
      context: .
      dockerfile: Dockerfile
    image: quality-inference:local
    container_name: quality-inference
    ports:
      - "8000:8000"
    environment:
      # Optional pause between replayed frames (ms) so the UI can show replay
      # progress; 0 keeps replay as fast as possible.
      QUALITY_REPLAY_PACE_MS: "0"
      # All engine state (frames, scores, gap, provisional state, pending
      # fills) is written here with atomic file replacement.  The named volume
      # survives `docker compose down`, image rebuilds and container crashes.
      QUALITY_DATA_DIR: /data
    volumes:
      - quality-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2))['status']=='ok'"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 8s

volumes:
  quality-data:
    name: quality-inference-data
